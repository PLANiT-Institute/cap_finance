# CAP pipeline configuration — methodology v2 (2026-09-10 external audit).
# The historical (legacy) reproduction convention that used to live here is
# preserved verbatim in config_legacy.yaml; `python -m cap <stage> --config
# config_legacy.yaml` reproduces the archived accounting diagnostic. This file
# is the RESEARCH convention: cash_v1 capital, gross carbon obligation, hard
# cumulative budget, mean selection, verified-series price factors.
data_dir: data/prepared     # prepare_raw.py output (D*.csv); tests use data/sample
out_dir: out
seed: 20260806

years: {start: 2025, end: 2050}
scenarios: [NZ15, B20]
support_scenarios: [none, current]   # none = gross

discount_rate: 0.024         # real RISK-FREE (KTB 10y 4.40% nominal 2026-09-11 − ~2% expected inflation); risk is priced separately by ES (L5). 0.05 = legacy real WACC-like rate, kept in config_legacy.yaml
discount_rate_sensitivity: [0.035, 0.065]

simulation:
  # 5,000에서는 P50/TCaR 수렴 검사가 2.6% 이탈해 스펙의 대응(10,000 상향)을 따랐다.
  n_sims: 10000
  # ⑤ 유연성 가치의 재최적화 부표본. 300에서는 시드 간 변동계수가 10~15%로
  # 표기 자릿수가 표본 잡음에 묻혔다(I4). 1,500으로 상향.
  n_sims_flex: 1500
  convergence_check_n: 2000  # P50/TCaR must match full run within 1%

# 가격 확률과정. gbm = 로그 랜덤워크(분산이 지평에 비례), ou = 로그 평균회귀(포화).
# D4 관측이 10~19개뿐이라 둘을 통계적으로 가를 수 없다 — 선택을 감추지 않고 드러내고
# TCaR 차이를 docs/process_alternative.md에 잰다 (I3).
price_process: gbm
ou_halflife_years: 10
# 충격 정규화. mean = E[충격]=1 (현행) — 로그정규 왜도로 **중앙값이 아래로 흐른다**:
# σ=0.25·25년이면 2050 중앙값이 중심경로의 0.47배다. ②는 P50 지표라 그 세계에서
# 계산된다. median = 중앙값을 중심경로에 고정(평균이 위로). D2b 중심경로가 평균인지
# 중앙값인지 출처가 명시하지 않으므로 선택을 드러낸다 (A-24, I3 문서에 영향 측정).
shock_normalisation: mean

milp:
  frontier_points: 10        # epsilon-constraint grid size (중복 제거 후 8~10개 생존)
  # 대형 인스턴스(NSC 1,110 이진변수)는 최적성 증명에 조합당 40분 이상을 쓴다. E2는
  # 계획을 '고르는' 것이 아니라 '나열'하는 단계이고 각 계획의 정본 비용·TCaR은 E4
  # 시뮬레이션이 다시 낸다. 상한에서 얻은 실행가능해도 후보로 채택하며, 그 사실은
  # plan_index.csv의 solve_status에 남아 감출 수 없다.
  solver_time_limit_s: 60
  # relative MIP gap. E2's objective is an ordering surrogate — the authoritative
  # cost of every plan comes from the E4 simulation — so proving surrogate
  # optimality to the last basis point costs tens of minutes and changes nothing.
  mip_gap_rel: 0.02
  # 1 = 재현 가능. 병렬 CBC는 스레드 경합이 탐색 순서를 바꾸므로 mip_gap_rel 안의
  # **동률 최적해 중 어느 것을 반환하는지**가 실행마다 달라진다. D11에서 같은 커밋·같은
  # 시드의 두 실행이 48계획 중 정본 중복제거 41 vs 42, surrogate_rho_nsc -0.105 vs -0.400을
  # 냈다 — 페이퍼 §0 대장이 기계 부하에 따라 흔들린다는 뜻이다. 속도보다 재현성을 산다.
  solver_threads: 1
  # early conversion writes off the incumbent campaign asset's remaining
  # straight-line book value (D1a incumbent_capex_unit); halfwidth = grace years
  # before a relining anchor that count as on-window
  reinvest_window_halfwidth: 1
  # soft carbon-budget violation price floor (천원/tCO2): without a floor the
  # penalty (2x carbon price) undercuts deep-abatement tech in early years and
  # the optimizer buys violations instead of transitions
  budget_violation_floor_thkrw: 300
  # early-closure cap: at most this share of company production may be retired —
  # demand/market-position proxy. Without it, NZ15 carbon prices (~520천원/t of
  # product) dwarf the ~70천원/t margin and full closure becomes the "optimum".
  retire_max_share: 0.2   # research cases use 0 (early closure NOT allowed): with closure allowed the surrogate objective makes 100% closure optimal because only a scenario-independent margin is forfeited (audit B2); 0.2 is the legacy demand-proxy cap

# 탄소비용에 실제 부과되는 배출 비율(유상할당). 전량 부과하면 탄소비용이 제품 마진의
# 10배가 되어 "전 설비 폐쇄"가 최적해가 된다 — 무상할당이 존재하는 현실과 어긋남.
# 앵커: K-ETS 4차 계획기간 발전외(철강·석화) 유상할당 15% (2026–2030, KETS_P4_CONFIRM_2025).
# 2030년 이후는 ESTIMATE(강화 추세 가정). 배출량 자체는 예산 제약에 전량 계상된다.
carbon_auction_share:
  2025: 0.10
  2030: 0.15
  2035: 0.30
  2040: 0.50
  2045: 0.75
  2050: 1.00

contracts:
  ppa_premium_pct: 0.08      # PPA price premium over central elec price
  epc_premium_pct: 0.10      # fixed-price EPC premium over central capex
  ccfd_fee_pct: 0.03         # CCfD fee as share of covered carbon cost

hydrogen:
  # h2 price = elec_price * kwh_per_kg / 1000 + electrolyzer_capex amortization
  kwh_per_kg: 52
  electrolyzer_capex_amort: 0.12   # annualization factor on capex per kg-capacity
  electrolyzer_kg_per_kw_yr: 150   # kg H2 per kW electrolyzer per year

# company carbon budget = base emissions x sector budget ratio from GCAM.
# NOT facility-level allocation (that is the MILP's job); this only scales the
# sector pathway to the company boundary. Documented in REDESIGN_SPEC §3 E1.
budget_scaling: intensity_ratio

# ---- Research convention (v2). The v1 historical values are in config_legacy.yaml.
capital_accounting: cash_v1
energy_balance_mode: explicit_retention
carbon_accounting_mode: gross_obligation_proxy   # p·E; free allocation A enters when D5 carries verified firm allocations
transition_loss_basis: incremental_cash
plan_selection_criterion: mean
budget_mode: cumulative_hard
financial_boundary_mode: strict
evaluation_contracts: legacy_grid

# ---- v2 audit fixes (docs/research_cycles/2026-09-10-investment-review/EXTERNAL_AUDIT_2026-09-10.md)
# A3: stochastic factors = verified annual series only (elec: KPX SMP + JEPX; co2: KAU;
#     coal, gas: World Bank CMO). Hydrogen is derived from electricity structurally,
#     construction capex is deterministic (no verified series -> no prior in the base).
price_factor_set: v2
# A2: PPA share fixes only the electricity the transition ADDS over the baseline's
#     purchases (total_purchase = v1 behaviour, a swap on volume the transition never created)
hedge_basis: incremental
# A1/B3: canonical frontier axes = expected incremental cost vs ES of the plan's OWN
#     cost distribution (v1: [p50, tcar], the rule Proposition 6 warns against)
frontier_axes: [mean, es_abs]
methodology_version: v2.0-2026-09-10
