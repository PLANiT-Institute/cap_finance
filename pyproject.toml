[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cap"
version = "2.0.0"
description = "Capital Allocation Pathway — facility MILP, TCaR, company frontier/gap (REDESIGN_SPEC.md)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pulp>=2.8",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
